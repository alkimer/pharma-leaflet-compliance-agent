<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio de pasos · ANMAT</title>
<style>
  :root {
    --bg: #080c11;
    --panel: #0e151b;
    --surface: #070b0e;
    --line: rgba(125, 214, 178, .26);
    --phos: #5cffb0;
    --phos-dim: #56cc95;
    --cyan: #6feaff;
    --magenta: #ff86dd;
    --amber: #ffcf6e;
    --red: #ff7280;
    --text: #e3f1ea;
    --muted: #93aca3;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 14px; line-height: 1.6; overflow-x: hidden;
  }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 22px; }

  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 16px 20px; margin-bottom: 18px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  }
  h1 {
    margin: 0; font-size: 16px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--phos);
  }
  .sub { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
  .spacer { flex: 1; }
  a.volver {
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    text-decoration: none; border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px;
  }
  a.volver:hover { color: var(--phos); border-color: var(--phos); }

  /* ---------- Selector de pasos ---------- */
  .pasos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .paso {
    text-align: left; padding: 13px 15px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    color: var(--text); font-family: var(--mono); transition: border-color .2s, background .2s;
  }
  .paso:hover { border-color: rgba(92,255,176,.5); }
  .paso .n { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
  .paso .t { margin-top: 4px; font-size: 13px; }
  .paso .a { margin-top: 5px; font-size: 11.5px; color: var(--muted); }
  .paso[aria-pressed="true"] {
    border-color: var(--phos); background: #10231b;
  }
  .paso[aria-pressed="true"] .n { color: var(--phos); }
  .paso:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- Layout ---------- */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }

  .panel { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 16px; }
  .panel h2 {
    margin: 0 0 4px; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--phos-dim);
  }
  .panel .desc { margin-bottom: 14px; font-size: 12px; color: var(--muted); }

  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  legend {
    padding: 0; margin-bottom: 8px; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--cyan);
  }
  label { display: block; margin: 12px 0 5px; font-size: 12px; color: var(--muted); letter-spacing: .05em; }
  .ayuda { margin-top: 4px; font-size: 11.5px; color: #7d9990; }

  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 8px 10px; font-family: var(--mono); font-size: 13px;
    color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 7px; resize: vertical;
  }
  textarea { min-height: 110px; line-height: 1.6; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
  textarea.prompt { min-height: 200px; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--phos); box-shadow: 0 0 0 2px rgba(92,255,176,.18);
  }
  .fila { display: flex; gap: 10px; }
  .fila > * { flex: 1; }

  .acciones { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  button.play {
    flex: 1; padding: 12px; font-family: var(--mono); font-size: 12.5px;
    letter-spacing: .16em; text-transform: uppercase; color: #04120b; font-weight: 600;
    background: var(--phos); border: 0; border-radius: 8px; cursor: pointer;
    transition: filter .2s, transform .1s;
  }
  button.play:hover:not(:disabled) { filter: brightness(1.1); }
  button.play:active:not(:disabled) { transform: translateY(1px); }
  button.play:disabled { background: #24382f; color: var(--muted); cursor: not-allowed; }
  button.reset {
    padding: 12px 16px; font-family: var(--mono); font-size: 12px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  button.reset:hover { color: var(--amber); border-color: rgba(255,207,110,.55); }

  /* ---------- Salida ---------- */
  .salida {
    min-height: 380px; max-height: 68vh; overflow: auto; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
    font-size: 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .salida.err { color: var(--red); border-color: rgba(255,114,128,.55); }
  .placeholder { color: var(--muted); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
  .tile { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .tile .v { font-size: 16px; color: var(--phos); }
  .tile .k { margin-top: 2px; font-size: 10.5px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab {
    padding: 5px 11px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  .tab[aria-pressed="true"] { color: var(--phos); border-color: var(--phos); }

  .aviso {
    margin-bottom: 14px; padding: 9px 12px; font-size: 12px; color: var(--amber);
    border: 1px solid rgba(255,207,110,.4); border-radius: 8px; background: rgba(255,207,110,.08);
  }
  .error-carga {
    padding: 16px 18px; border: 1px solid rgba(255,114,128,.55); border-radius: 10px;
    background: rgba(255,114,128,.09); color: var(--red);
  }
  .error-carga b { color: var(--red); }
  .error-carga .detalle { margin-top: 8px; color: var(--text); font-size: 12.5px; line-height: 1.6; }
  .error-carga code { color: var(--amber); }
  .error-carga button {
    margin-top: 12px; padding: 8px 14px; font-family: var(--mono); font-size: 12px;
    letter-spacing: .1em; text-transform: uppercase; color: #180307;
    background: var(--red); border: 0; border-radius: 7px; cursor: pointer;
  }

  .hidden { display: none; }
  .corriendo { animation: latido 1.2s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .55; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Laboratorio de pasos</h1>
      <div class="sub">probar un paso solo · entradas, parámetros y prompt a medida</div>
    </div>
    <div class="spacer"></div>
    <a class="volver" href="/">← Pipeline completo</a>
  </header>

  <div class="pasos" id="pasos"></div>

  <div class="grid">
    <!-- ---------------- Configuración ---------------- -->
    <form class="panel" id="form">
      <h2 id="titulo">Elegí un paso</h2>
      <div class="desc" id="desc">Cada paso corre solo, con los datos que le des acá.</div>
      <div class="aviso hidden" id="aviso"></div>

      <fieldset id="fs-entradas"><legend>Entradas</legend><div id="entradas"></div></fieldset>
      <fieldset id="fs-parametros"><legend>Parámetros</legend><div id="parametros"></div></fieldset>
      <fieldset id="fs-prompts">
        <legend>Prompt del agente</legend>
        <div class="ayuda" style="margin-bottom:8px">
          Se usa solo en esta ejecución: no se escribe al repo.
        </div>
        <div id="prompts"></div>
      </fieldset>

      <div class="acciones">
        <button class="play" type="submit" id="play" disabled>▶ Ejecutar</button>
        <button class="reset" type="button" id="reset">Restaurar</button>
      </div>
    </form>

    <!-- ---------------- Salida ---------------- -->
    <div class="panel">
      <div class="tabs" id="tabs"></div>
      <div class="salida" id="salida"><span class="placeholder">La salida del paso aparece acá.</span></div>
      <div class="tiles hidden" id="tiles"></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const miles = (n) => (n ?? 0).toLocaleString("es-AR");

let CATALOGO = [], claudeOk = true, actual = null, ultima = null, pestania = "salida";

// ---------------------------------------------------------------- campos
function campoHTML(campo, grupo) {
  const id = `${grupo}__${campo.nombre}`;
  const comun = `id="${id}" data-grupo="${grupo}" data-nombre="${esc(campo.nombre)}"`;
  let control;

  if (campo.tipo === "area") {
    const clase = grupo === "prompts" ? "prompt" : "";
    control = `<textarea ${comun} class="${clase}" spellcheck="false">${esc(campo.valor)}</textarea>`;
  } else if (campo.tipo === "opciones") {
    // datalist en vez de select: la lista sugiere, pero se puede escribir otro.
    const lista = `lista__${id}`;
    control = `<input type="text" ${comun} list="${lista}" value="${esc(campo.valor)}">
      <datalist id="${lista}">${campo.opciones.map(o => `<option value="${esc(o)}">`).join("")}</datalist>`;
  } else if (campo.tipo === "numero") {
    control = `<input type="number" step="any" ${comun} value="${esc(campo.valor)}">`;
  } else {
    control = `<input type="text" ${comun} value="${esc(campo.valor)}">`;
  }

  const ayuda = campo.ayuda ? `<div class="ayuda">${esc(campo.ayuda)}</div>` : "";
  const etiqueta = campo.lenguaje ? `${esc(campo.etiqueta)}  ·  ${esc(campo.lenguaje)}` : esc(campo.etiqueta);
  return `<label for="${id}">${etiqueta}</label>${control}${ayuda}`;
}

function recolectar(grupo) {
  const datos = {};
  document.querySelectorAll(`[data-grupo="${grupo}"]`).forEach(el => {
    datos[el.dataset.nombre] = el.value;
  });
  return datos;
}

// ---------------------------------------------------------------- pasos
function pintarPasos() {
  $("pasos").innerHTML = CATALOGO.map(p => {
    const claude = p.agente.includes("Anthropic");
    const off = claude && !claudeOk;
    return `<button class="paso" type="button" data-id="${p.id}" aria-pressed="false"
              ${off ? "disabled title='Requiere ANTHROPIC_API_KEY en el .env'" : ""}>
      <div class="n">PASO ${esc(p.numero)}</div>
      <div class="t">${esc(p.titulo)}</div>
      <div class="a">${esc(p.agente)}</div>
    </button>`;
  }).join("");

  $("pasos").querySelectorAll(".paso").forEach(b =>
    b.addEventListener("click", () => elegir(b.dataset.id)));
}

function elegir(id) {
  actual = CATALOGO.find(p => p.id === id);
  $("pasos").querySelectorAll(".paso").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.id === id)));

  $("titulo").textContent = `Paso ${actual.numero} · ${actual.titulo}`;
  $("desc").textContent = actual.descripcion;

  const secciones = [["entradas", actual.entradas], ["parametros", actual.parametros],
                     ["prompts", actual.prompts]];
  for (const [grupo, campos] of secciones) {
    $(grupo).innerHTML = campos.map(c => campoHTML(c, grupo)).join("");
    $("fs-" + grupo).classList.toggle("hidden", campos.length === 0);
  }

  const sinModelo = !actual.parametros.length && !actual.prompts.length;
  $("aviso").classList.toggle("hidden", !sinModelo);
  if (sinModelo) $("aviso").textContent = "Este paso no llama a ningún modelo: no gasta tokens.";

  $("play").disabled = false;
  $("salida").className = "salida";
  $("salida").innerHTML = '<span class="placeholder">Listo para ejecutar.</span>';
  $("tiles").classList.add("hidden");
  $("tabs").innerHTML = "";
  ultima = null;
}

// ---------------------------------------------------------------- salida
function pintarSalida() {
  if (!ultima) return;
  const vistas = { salida: "Salida" };
  if (ultima.texto) vistas.texto = "Informe";
  if (ultima.detalle) vistas.detalle = "Detalle";

  $("tabs").innerHTML = Object.entries(vistas).map(([k, v]) =>
    `<button class="tab" type="button" data-v="${k}" aria-pressed="${k === pestania}">${v}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b =>
    b.addEventListener("click", () => { pestania = b.dataset.v; pintarSalida(); }));

  let contenido;
  if (pestania === "texto") contenido = ultima.texto;
  else if (pestania === "detalle") contenido = JSON.stringify(ultima.detalle, null, 2);
  else contenido = ultima.formato === "json"
    ? JSON.stringify(ultima.salida, null, 2) : String(ultima.salida);

  $("salida").className = "salida";
  $("salida").textContent = contenido;

  const t = (ultima.consumo || {}).totals || {};
  const tiles = [[ultima.duracion_s + "s", "duración"]];
  if (t.calls) {
    tiles.push(
      [miles(t.input_tokens), "tokens in"],
      [miles(t.output_tokens), "tokens out"],
      [t.cost_usd == null ? "s/d" : "US$ " + t.cost_usd.toFixed(4).replace(".", ","), "costo"],
    );
  }
  $("tiles").innerHTML = tiles.map(([v, k]) =>
    `<div class="tile"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join("");
  $("tiles").classList.remove("hidden");
}

// ---------------------------------------------------------------- ejecución
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!actual) return;

  const play = $("play");
  play.disabled = true;
  play.textContent = "▶ Ejecutando…";
  $("salida").className = "salida corriendo";
  $("salida").innerHTML = '<span class="placeholder">Corriendo el paso…</span>';
  $("tiles").classList.add("hidden");

  try {
    const resp = await fetch("/api/laboratorio/ejecutar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        paso: actual.id,
        entradas: recolectar("entradas"),
        parametros: recolectar("parametros"),
        prompts: recolectar("prompts"),
      }),
    });
    const cuerpo = await resp.json();
    if (!resp.ok) throw new Error(cuerpo.detail || resp.statusText);
    ultima = cuerpo;
    pestania = "salida";
    pintarSalida();
  } catch (err) {
    $("salida").className = "salida err";
    $("salida").textContent = "✖  " + err.message;
    $("tiles").classList.add("hidden");
  } finally {
    play.disabled = false;
    play.textContent = "▶ Ejecutar";
  }
});

$("reset").addEventListener("click", () => { if (actual) elegir(actual.id); });

// ---------------------------------------------------------------- arranque
function errorDeCarga(titulo, detalle) {
  // Sin catálogo no hay nada que elegir. Antes la página quedaba en blanco y no
  // había forma de saber por qué; ahora dice qué pasó y cómo salir.
  $("pasos").innerHTML = `<div class="error-carga" style="grid-column:1/-1">
    <b>✖ ${esc(titulo)}</b>
    <div class="detalle">${detalle}</div>
    <button type="button" id="reintentar">Reintentar</button>
  </div>`;
  $("reintentar").addEventListener("click", cargar);
  $("play").disabled = true;
}

async function cargar() {
  $("pasos").innerHTML = '<div class="sub" style="grid-column:1/-1">cargando los pasos…</div>';
  let respuesta;
  try {
    respuesta = await fetch("/api/laboratorio");
  } catch (e) {
    const suelta = location.protocol === "file:";
    return errorDeCarga(
      suelta ? "La página se abrió como archivo, no desde el servidor"
             : "No se pudo contactar al servidor",
      suelta
        ? `Está corriendo desde <code>${esc(location.protocol)}//</code>, así que no hay API a la que pedirle los pasos.<br>
           Levantá el server con <code>python run_web.py</code> y entrá por <code>http://127.0.0.1:8000/laboratorio</code>.`
        : `El pedido a <code>/api/laboratorio</code> falló: ${esc(e.message)}.<br>
           ¿Sigue corriendo <code>python run_web.py</code>?`);
  }

  if (respuesta.status === 404) {
    return errorDeCarga(
      "El servidor no conoce el laboratorio",
      `<code>/api/laboratorio</code> devolvió 404. Suele ser un server iniciado antes de que
       existiera esta pantalla: las rutas se registran al arrancar.<br>
       Cortalo con Ctrl+C y volvé a levantarlo con <code>python run_web.py</code>.`);
  }
  if (!respuesta.ok) {
    let detalle = respuesta.statusText;
    try { detalle = (await respuesta.json()).detail || detalle; } catch { /* no era JSON */ }
    return errorDeCarga(`El servidor respondió ${respuesta.status}`, esc(detalle));
  }

  try {
    const ctx = await respuesta.json();
    CATALOGO = ctx.pasos || [];
    claudeOk = ctx.claude_disponible;
    if (!CATALOGO.length) {
      return errorDeCarga("El servidor no devolvió ningún paso",
        "Revisá el log de <code>run_web.py</code>.");
    }
    pintarPasos();
    elegir(CATALOGO[0].id);
  } catch (e) {
    errorDeCarga("La respuesta del servidor no se pudo leer", esc(e.message));
  }
}

cargar();
</script>
</body>
</html>
